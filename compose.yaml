# The console with every tool inside: `docker compose up`, then open http://127.0.0.1:8765.
# One-off recipes: `docker compose run --rm console just <recipe>`. Settings: copy .env.example to .env.
services:
  console:
    image: ghcr.io/wbm99/aws-channel-with-terraform:latest
    build: { context: ., dockerfile: docker/Dockerfile, target: runtime }
    command: ["livectl", "ui", "--host", "0.0.0.0", "--container", "--no-browser"]
    # Files written into the checkout (state, provider caches) belong to the host user. Bash does not export UID, so
    # anyone whose `id -u` is not 1000 sets UID and GID in .env.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      # Keep the 127.0.0.1 prefix: without it the console, which can destroy the stack, is reachable from the LAN.
      - "127.0.0.1:${CONSOLE_PORT:-8765}:8765"
    volumes:
      - type: bind
        source: .
        target: /work
      # Read-write, as the AWS CLI uses it: SSO saves refreshed tokens in ~/.aws/sso/cache.
      - type: bind
        source: ${HOME}/.aws
        target: /home/app/.aws
        bind: { create_host_path: false }  # a missing ~/.aws is an error, not a new root-owned directory
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-default}
      CONSOLE_URL: http://127.0.0.1:${CONSOLE_PORT:-8765}/

  # Grafana on CloudWatch: the MediaConnect source dashboard, provisioned from observability/grafana. It queries AWS
  # only while a dashboard is open (about 0.06-0.40 USD/hour then), so close the tab when you are not watching.
  grafana:
    image: grafana/grafana-oss:13.0.2
    # The host user, like the console: ~/.aws/credentials is readable by its owner only.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      # Keep the 127.0.0.1 prefix, as for the console: Grafana holds working AWS credentials.
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ./observability/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
      - type: bind
        source: ./observability/grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
      # Read-only: Grafana never writes credentials. SSO profiles are untested here (see the README).
      - type: bind
        source: ${HOME}/.aws
        target: /aws
        read_only: true
        bind: { create_host_path: false }
      # The admin password and Grafana's own database survive restarts here.
      - grafana-data:/var/lib/grafana
    environment:
      AWS_CONFIG_FILE: /aws/config
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Read only when Grafana creates its database. With the default, the first login asks for a new password.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Each refresh is a billed CloudWatch query: nobody can pick a faster one than the dashboard's 5 s.
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
      # No plugin installs (they fail under a non-grafana UID) and no calls home.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"

volumes:
  grafana-data:
